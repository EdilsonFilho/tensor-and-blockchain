[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-chain"
version = "0.2.0"
description = "Anomaly detection in Ethereum transactions with tensor decompositions"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Edilson Filho" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "sparse>=0.15",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "streamlit>=1.50",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tensor-chain = "tensor_chain.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
